# Deploy on your server. Values are read from a local .env file that is not committed.
services:
  pi-web:
    image: ${PI_WEB_IMAGE:?Set PI_WEB_IMAGE in .env}
    container_name: pi-web
    restart: unless-stopped
    ports:
      - "30141:30141"
    environment:
      # REQUIRED when exposed to the internet. Username is always "pi".
      PI_WEB_PASSWORD: ${PI_WEB_PASSWORD:?Set PI_WEB_PASSWORD in .env}
      # REQUIRED for access through a domain or reverse proxy.
      PI_WEB_ALLOWED_HOSTS: ${PI_WEB_ALLOWED_HOSTS:?Set PI_WEB_ALLOWED_HOSTS in .env}
    volumes:
      # Persists pi state: ~/.pi (sessions/auth/models), ~/.agents (skills),
      # and any ~/pi-cwd-* working directories. HOME is /data inside the image.
      - pi-web-data:/data

volumes:
  pi-web-data:
